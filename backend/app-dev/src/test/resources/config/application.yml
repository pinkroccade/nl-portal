server:
    port: 0
    forward-headers-strategy: none

management:
    server:
        port: 0
    health:
        redis:
            enabled: false

spring:
    profiles:
        default: test
    graphql:
        graphiql:
            enabled: true
        schema:
            locations: classpath*:graphql/**/
    data:
        redis:
            repositories:
                enabled: false

nl-portal:
    sleutelmap: build/test-sleutels
    tenancy:
        directory: src/test/resources/tenants
    # De secret store van de test: de geheimen van de koppelingen `zakenapi` en `payment-direct` in het tenantbestand (zaken: minstens 32 tekens voor een ZGW-JWT).
    geheimen:
        "00000099000000000001.zaken-secret": testwaarde-zaken-geheim-voor-de-app-test-0123456789
        "00000099000000000001.payment-direct-api-geheim": test-api-geheim
        "00000099000000000001.payment-direct-webhook-geheim": test-webhook-geheim
    security:
        cors:
            -   path: "/**"
                config:
                    allowedHeaders: "*"
                    allowedOrigins: "*"
                    allowedMethods: "*"
        endpoints:
            unsecured: /api/public/**
    authentication:
        broker-url: http://localhost:9999
    config:
        besluitenapi:
            enabled: true
            properties:
                url: http://localhost:56789
                clientId: test-client
                secret: 12345678123456781234567812345678
        catalogiapi:
            enabled: true
            properties:
                url: http://localhost:56789
                clientId: test-client
                secret: 12345678123456781234567812345678
        documentenapis:
            enabled: true
            properties:
                default-document-api: openzaak
                vertrouwelijkheidsaanduiding-whitelist:
                    - openbaar
                    - beperkt_openbaar
                    - intern
                    - zaakvertrouwelijk
                    - vertrouwelijk
                    - confidentieel
                    - geheim
                    - zeer_geheim
                status-whitelist:
                    - ter_vaststelling
                    - in_bewerking
                    - definitief
                    - gearchiveerd
                configurations:
                    openzaak:
                        url: http://localhost:56789/documenten/api/v1
                        clientId: test-client
                        secret: test-secret
                        rsin: "051845623"
                        documentTypeUrl: http://localhost:56789/catalogi/api/v1/informatieobjecttypen/00000000-0000-0000-0000-000000000000
        virusscan:
            clamav:
                enabled: false
        zakenapi:
            enabled: true
        objectenapi:
            enabled: true
            properties:
                url: http://localhost:56789
                token: 0000000000000000000000000000000000000000
        openklant2:
            enabled: true
            properties:
                klantinteracties-api-url: http://localhost:56789/klantinteracties/api/v1
                token: 0000000000000000000000000000000000000000
        haalcentraal-brp:
            enabled: true
        kvk:
            enabled: true
            properties:
                url: http://localhost:56789
                apiKey: test-api-key
                ssl:
                    enabled: false
        taak:
            enabled: true
            properties:
                object-type-url: http://localhost:56789/api/v2/objecttypes/00000000-0000-0000-0000-000000000001
        berichten:
            enabled: true
            properties:
                bericht-object-type-url: http://localhost:56789/api/v2/objecttypes/00000000-0000-0000-0000-000000000002
        openproduct:
            enabled: true
            properties:
                token: 0000000000000000000000000000000000000000
                product-api-url: http://localhost:56789/producten/api/v1
                product-type-api-url: http://localhost:56789/producttypen/api/v1
        product:
            enabled: true
            properties:
                product-type-url: http://localhost:56789/api/v1/objecttypes/00000000-0000-0000-0000-000000000003
                product-instantie-type-url: http://localhost:56789/api/v1/objecttypes/00000000-0000-0000-0000-000000000004
                product-details-type-url: http://localhost:56789/api/v1/objecttypes/00000000-0000-0000-0000-000000000005
                product-verbruiks-object-type-url: http://localhost:56789/api/v1/objecttypes/00000000-0000-0000-0000-000000000006
        dmn:
            enabled: true
            properties:
                url: http://localhost:56789
        prefill:
            enabled: true
            properties:
                type-url: http://localhost:56789/api/v1/objecttypes/00000000-0000-0000-0000-000000000007
        verificatie:
            enabled: true
        theme:
            logo:
            style:
        features:
            properties:
                theme-class: "test"
            toggles:
                theme-api-enabled: false
                message-count-enabled: false
