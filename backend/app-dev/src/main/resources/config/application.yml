server:
    port: 8080
    # De tenantresolutie volgt Forwarded alleen van vertrouwde proxies; Spring zelf volgt niets (ForwardedHeadersGuard).
    forward-headers-strategy: none

management:
    server:
        # De actuator staat op een eigen poort, nooit op de applicatiepoort (ManagementExposureGuard, ADR 0021 besluit 8).
        port: ${MANAGEMENT_SERVER_PORT:8091}
    endpoint:
        health:
            access: read_only
            probes:
                enabled: true
        modulestatus:
            access: read_only
    endpoints:
        access:
            default: none
        web:
            exposure:
                include: health, modulestatus

spring:
    application:
        name: nl-portal-app-dev
    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: http://localhost:8082/realms/nlportal/protocol/openid-connect/certs
                    issuer-uri: http://localhost:8082/realms/nlportal
    graphql:
        graphiql:
            enabled: true
        schema:
            locations: classpath*:graphql/**/
            introspection:
                enabled: true

graphql:
    packages:
        - "nl.nlportal"

logging:
    level:
        root: DEBUG

nl-portal:
    # De demo-tenant van de compose-stack (koppelingen en modulegegevens, zoals de Documenten API); de geheimen komen uit .env.properties.
    tenancy:
        directory: ${NL_PORTAL_TENANTS_DIRECTORY:../../docker-compose/imports/tenants}
    # De secret store van deze dev-app: de geheimen van de koppelingen in het tenantbestand (zakenapi, catalogiapi, objectenapi en documenten).
    geheimen:
        "00000099000000000001.zaken-secret": ${OPENZAAK_NLPORTAL_SECRET}
        "00000099000000000001.catalogiapi-secret": ${OPENZAAK_NLPORTAL_SECRET}
        "00000099000000000001.documenten-api-secret": ${OPENZAAK_NLPORTAL_SECRET}
        "00000099000000000001.objectenapi-token": Token ${OBJECTS_API_TOKEN}
        "00000099000000000001.documenten-dummydoc-secret": ${OPENZAAK_NLPORTAL_SECRET}
    support:
        ping-endpoint:
            enabled: false
    authentication:
        keycloak:
            resource: nl-portal-m2m
            credentials:
                secret: ${KEYCLOAK_CLIENT_SECRET:}
    security:
        cors:
            -   path: "/**"
                config:
                    allowedHeaders: "*"
                    allowedOrigins: "*"
                    allowedMethods: "*"
        endpoints:
            unsecured: /api/public/**
    config:
        besluitenapi:
            enabled: true
            properties:
                url: http://localhost:8001
                clientId: nl-portal
                secret: ${OPENZAAK_NLPORTAL_SECRET}
        catalogiapi:
            enabled: true
        documentenapis:
            enabled: true
        virusscan:
            clamav:
                enabled: true
                properties:
                    hostname: localhost
                    port: 3310
        zakenapi:
            enabled: true
        objectenapi:
            enabled: true
        openklant2:
            enabled: true
            properties:
                contactgegevens-api-url: http://localhost:8014/contactgegevens/api/v1
                klantinteracties-api-url: http://localhost:8014/klantinteracties/api/v1
                token: ${OPENKLANT_API_TOKEN}
        haalcentraal-brp:
            enabled: true
        kvk:
            # Uit zolang het demo-tenantbestand (docker-compose/imports/tenants) het blok `koppelingen.kvk` in commentaar heeft: aan zonder
            # die koppeling weigert het opstarten. Zet hem aan zodra de koppeling in het tenantbestand staat.
            enabled: false
        taak:
            enabled: true
            properties:
                object-type-url: http://localhost:8010/api/v2/objecttypes/b4a617af-6969-45e8-9afd-d51e170716d5
        form:
            properties:
                form-definition-object-type-url: http://localhost:8010/api/v2/objecttypes/4b5f4fba-0746-11ed-b939-0242ac120002
        openproduct:
            enabled: true
            properties:
                token: ${OPENPRODUCT_API_TOKEN}
                product-api-url: http://localhost:8015/producten/api/v1
                product-type-api-url: http://localhost:8015/producttypen/api/v1
                prefill:
                    type-url: http://localhost:8010api/v2/objecttypes/e3cb704f-4091-40c7-a1ee-e8443e74ed0e
        product:
            enabled: true
            properties:
                product-type-url: http://localhost:8010/api/v2/objecttypes/10b88cbd-5b9e-4e25-8635-eda8fe5ad227
                product-instantie-type-url: http://localhost:8010/api/v2/objecttypes/d5ae0ab0-fd6d-40a2-87ae-54d11a85d3d8
                product-details-type-url: http://localhost:8010/api/v2/objecttypes/7165a692-2632-4a5d-b8ba-e360dafc4bce
                product-verbruiks-object-type-url: http://localhost:8010/api/v2/objecttypes/41778685-f876-4f74-ab54-b04ff23524b8
        dmn:
            enabled: true
            properties:
                url: http://localhost:8010
        prefill:
            enabled: true
            properties:
                type-url: http://localhost:8010/api/v2/objecttypes/3e852115-277a-4570-873a-9a64be3aeb37
        verificatie:
            enabled: true
    frontend:
        theme:
            logo:
            style:
        properties:
            message-count-polling-interval: 10000
            overview-current-cases-preview-length: 4
            overview-maintenance-alert-title-nl: Ontwikkelmodus
            overview-maintenance-alert-title-en: Development mode
            overview-maintenance-alert-text-nl: Deze omgeving draait in ontwikkelmodus met testgegevens.
            overview-maintenance-alert-text-en: This environment is running in development mode with test data.
            overview-current-tasks-preview-length: 4
        modules-whitelist:
            - zakenapi
            - product
            - haalcentraal-brp
            - taak
            - openproduct
