graphql:
    packages:
        - "nl.nlportal"

logging:
    level:
        reactor.netty.http.client.HttpClient: TRACE

nl-portal:
    config:
        catalogiapi:
            enabled: true
            properties:
                url: http://localhost:8001
                clientId: valtimo_client
                secret: e09b8bc5-5831-4618-ab28-41411304309d
        besluitenapi:
            enabled: true
            properties:
                url: http://localhost:8001
                clientId: valtimo_client
                secret: e09b8bc5-5831-4618-ab28-41411304309d
        documentenapis:
            enabled: true
        zakenapi:
            enabled: true

        objectenapi:
            enabled: true
    authentication:
        machtingsdienst:
            resource-url: classpath:machtigingsdiensten.json
            configurations:
                - uuid: 0781d1a1-0644-44fd-802e-96f6b588b472
                  naam: test
                  zaak-types:
                    - c8783fd1-0a49-41e1-a8e7-9a3d3e39951f
                    - e599a114-c3fc-4f70-b36e-02ffff1bab4a
                  taak-types:
                    - test

spring:
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8082/auth/realms/nlportal
