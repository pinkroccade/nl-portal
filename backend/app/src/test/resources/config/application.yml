server:
    port: 0
    forward-headers-strategy: none

management:
    server:
        port: 0

spring:
    profiles:
        default: test
    graphql:
        graphiql:
            enabled: true
        schema:
            locations: classpath*:graphql/**/
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:9999/auth/realms/test

nl-portal:
    tenancy:
        directory: src/test/resources/tenants
    geheimen:
        # Geheimen van de testtenant (zie tenants/00000099000000000001.yaml): <oin>.<naam>
        "00000099000000000001":
            documenten-api-secret: 12345678123456781234567812345678
            kvk-sleutel: test-kvk-sleutel
            zaken-secret: testwaarde-zaken-geheim-voor-de-app-test-0123456789
            objectenapi-token: Token 0000000000000000000000000000000000000000
            payment-direct-api-geheim: test-api-geheim
            payment-direct-webhook-geheim: test-webhook-geheim
    security:
        endpoints:
            unsecured: /api/public/**
    authentication:
        keycloak:
            resource: test-client
            audience: test-audience
            credentials:
                secret: test-secret
    config:
        besluitenapi:
            enabled: true
            properties:
                url: http://localhost:56789
                clientId: test-client
                secret: 12345678123456781234567812345678
        catalogiapi:
            enabled: true
            properties:
                url: http://localhost:56789
                clientId: test-client
                secret: 12345678123456781234567812345678
        documentenapis:
            enabled: true
        virusscan:
            clamav:
                enabled: false
        zakenapi:
            enabled: true
        objectenapi:
            enabled: true
        openklant2:
            enabled: true
            properties:
                klantinteracties-api-url: http://localhost:56789/klantinteracties/api/v1
                token: 0000000000000000000000000000000000000000
        haalcentraal-brp:
            enabled: true
        kvk:
            enabled: true
        taak:
            enabled: true
            properties:
                object-type-url: http://localhost:56789/api/v2/objecttypes/00000000-0000-0000-0000-000000000001
        openproduct:
            enabled: true
            properties:
                token: 0000000000000000000000000000000000000000
                product-api-url: http://localhost:56789/producten/api/v1
                product-type-api-url: http://localhost:56789/producttypen/api/v1
        product:
            enabled: true
            properties:
                product-type-url: http://localhost:56789/api/v1/objecttypes/00000000-0000-0000-0000-000000000003
                product-instantie-type-url: http://localhost:56789/api/v1/objecttypes/00000000-0000-0000-0000-000000000004
                product-details-type-url: http://localhost:56789/api/v1/objecttypes/00000000-0000-0000-0000-000000000005
                product-verbruiks-object-type-url: http://localhost:56789/api/v1/objecttypes/00000000-0000-0000-0000-000000000006
        dmn:
            enabled: true
            properties:
                url: http://localhost:56789
        prefill:
            enabled: true
            properties:
                type-url: http://localhost:56789/api/v1/objecttypes/00000000-0000-0000-0000-000000000007
        verificatie:
            enabled: true
        theme:
            logo:
            style:
        features:
            properties:
                theme-class: "test"
            toggles:
                theme-api-enabled: false
                message-count-enabled: false
