server:
    port: 8080
    # Spring volgt zelf geen Forwarded of X-Forwarded-*: de tenantresolutie doet dat alleen van de vertrouwde proxies
    # (nl-portal.tenancy.trusted-proxies). Expliciet, want Spring Boot zet het op Kubernetes anders aan; de runtime
    # start niet met native of framework (ForwardedHeadersGuard).
    forward-headers-strategy: none

management:
    server:
        # De actuator staat altijd op een eigen poort en nooit op de applicatiepoort (ADR 0021 besluit 8, regel 5);
        # de runtime start niet zonder (zie site/hosting-en-configuratie/beheer-modulestatus.md).
        port: ${MANAGEMENT_SERVER_PORT:8091}
    endpoint:
        health:
            access: read_only
            probes:
                enabled: true
        modulestatus:
            access: read_only
    endpoints:
        access:
            default: none
        web:
            exposure:
                include: health, modulestatus

spring:
    application:
        name: nl-portal-app
    data:
        redis:
            # Sessies en pre-auth-sessies van de BFF (ADR 0022). Redis draait met authenticatie (ACL), zonder persistentie en met
            # een TTL op elke sleutel; buiten lokaal met TLS (REDIS_SSL=true). Eén instantie per cel.
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            username: ${REDIS_USERNAME:}
            password: ${REDIS_PASSWORD:}
            ssl:
                enabled: ${REDIS_SSL:false}
            repositories:
                enabled: false
    graphql:
        graphiql:
            enabled: false
        schema:
            locations: classpath*:graphql/**/
            introspection:
                enabled: false

graphql:
    packages:
        - "nl.nlportal"

logging:
    level:
        root: ${LOGLEVEL:INFO}

nl-portal:
    tenancy:
        # Map met base.yaml en per tenant <oin>.yaml (het tenantbestand); verplicht, de runtime start niet zonder.
        directory: ${NL_PORTAL_TENANTS_DIRECTORY}
        # IP-adressen of CIDR-blokken van de ingress; alleen van deze adressen gelden Forwarded en X-Forwarded-Host.
        trusted-proxies: ${NL_PORTAL_TRUSTED_PROXIES:}
    authentication:
        # Publieke basis-URL van de broker (Keycloak). De runtime start niet als de issuer van een tenant er niet onder valt.
        broker-url: ${KEYCLOAK_BROKER_URL}
        machtingsdienst:
            resource-url: # classpath:example-machtigingsdiensten.json
    security:
        endpoints:
            unsecured: /api/public/**
    frontend:
        modules-whitelist:
            - zakenapi
            - product
            - haalcentraal-brp
            - taak
            - openproduct
