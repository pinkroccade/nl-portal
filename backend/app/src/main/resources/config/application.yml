server:
    port: 8080
    # Spring volgt zelf geen Forwarded of X-Forwarded-*: de tenantresolutie doet dat alleen van de vertrouwde proxies
    # (nl-portal.tenancy.trusted-proxies). Expliciet, want Spring Boot zet het op Kubernetes anders aan; de runtime
    # start niet met native of framework (ForwardedHeadersGuard).
    forward-headers-strategy: none

management:
    server:
        # De actuator staat altijd op een eigen poort en nooit op de applicatiepoort (ADR 0021 besluit 8, regel 5);
        # de runtime start niet zonder (zie site/hosting-en-configuratie/beheer-modulestatus.md).
        port: ${MANAGEMENT_SERVER_PORT:8091}
    endpoint:
        health:
            access: read_only
            probes:
                enabled: true
        modulestatus:
            access: read_only
    endpoints:
        access:
            default: none
        web:
            exposure:
                include: health, modulestatus

spring:
    application:
        name: nl-portal-app
    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: ${JWKS_URI}
                    # Verwachte issuer (publieke URL van de realm); verplicht, zie keycloak-token-exchange.md.
                    issuer-uri: ${KEYCLOAK_ISSUER_URI}
    graphql:
        graphiql:
            enabled: false
        schema:
            locations: classpath*:graphql/**/
            introspection:
                enabled: false

graphql:
    packages:
        - "nl.nlportal"

logging:
    level:
        root: ${LOGLEVEL:INFO}

nl-portal:
    tenancy:
        # Map met base.yaml en per tenant <oin>.yaml (het tenantbestand); verplicht, de runtime start niet zonder.
        directory: ${NL_PORTAL_TENANTS_DIRECTORY}
        # IP-adressen of CIDR-blokken van de ingress; alleen van deze adressen gelden Forwarded en X-Forwarded-Host.
        trusted-proxies: ${NL_PORTAL_TRUSTED_PROXIES:}
    authentication:
        keycloak:
            resource: ${KEYCLOAK_CLIENT_ID}
            audience: ${KEYCLOAK_TOKEN_EXCHANGE_AUDIENCE:}
            token-uri: ${KEYCLOAK_TOKEN_URI:}
            credentials:
                secret: ${KEYCLOAK_CLIENT_SECRET}
        machtingsdienst:
            resource-url: # classpath:example-machtigingsdiensten.json
    security:
        endpoints:
            unsecured: /api/public/**
    frontend:
        modules-whitelist:
            - zakenapi
            - product
            - haalcentraal-brp
            - taak
            - openproduct
