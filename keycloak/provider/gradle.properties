# De Keycloak-versie waartegen de provider wordt gebouwd. Moet gelijk zijn aan de versie van het basisimage in
# keycloak/Dockerfile (ARG KEYCLOAK_VERSION); `mise run keycloak:check-version` en de Dockerfile zelf falen bij verschil.
keycloakVersion=26.8.2
# Java-versie van het Keycloak-image (de provider draait in de Keycloak-JVM); bytecode-target, niet de build-JDK.
keycloakJavaRelease=21
