map $http_x_forwarded_proto $hsts {
    default "";
    https "max-age=31536000; includeSubDomains";
}

server {
    listen       8081;
    server_name  nl-portal-app-frontend;

    gzip on;
    gzip_proxied any;
    gzip_buffers 16 8k;
    gzip_types text/plain application/javascript application/x-javascript text/javascript text/xml text/css;
    gzip_vary on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security $hsts always;

    # CSP: geen data: buiten afbeeldingen, geen frames of plug-ins, geen <base>-injectie en niet inframebaar (clickjacking van een
    # cookiesessie). form-action ontbreekt bewust: Chromium toetst het ook op de redirect na de uitlog-POST naar Keycloak, dus
    # 'self' breekt het uitloggen en de broker-URL is hier niet bekend; zie site/hosting-en-configuratie/tenantbestand-flag-en-secret-store.md.
    set $csp "default-src 'self'; img-src 'self' data:; script-src 'self' 'nonce-$request_id'; style-src 'self' 'nonce-$request_id'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";

    # HSTS alleen als de ingress (TLS-terminatie) https meldt; over http negeert de browser de header toch.
    # Let op: add_header in een location vervangt de headers van het server-blok, dus de headers staan per location.

    location = /graphql {
        # De host met poort zoals de browser hem stuurde: de backend leidt er de tenant en de origin van af (BFF).
        proxy_set_header Host $http_host;
        # Door de client gezette doorstuurheaders worden overschreven: nginx is de enige bron van deze waarden. Het sidecar-adres
        # (127.0.0.1/::1) hoort daarom nooit in nl-portal.tenancy.trusted-proxies; zie site/hosting-en-configuratie/tenantbestand-flag-en-secret-store.md.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://localhost:8080;
    }

    location ^~ /api/ {
        # De host met poort zoals de browser hem stuurde: de backend leidt er de tenant en de origin van af (BFF).
        proxy_set_header Host $http_host;
        # Door de client gezette doorstuurheaders worden overschreven: nginx is de enige bron van deze waarden. Het sidecar-adres
        # (127.0.0.1/::1) hoort daarom nooit in nl-portal.tenancy.trusted-proxies; zie site/hosting-en-configuratie/tenantbestand-flag-en-secret-store.md.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://localhost:8080;
    }

    # Inloggen, de callback en uitloggen lopen via de backend (BFF): same-origin, zodat de cookies bij het portaaldomein horen.
    location ~ ^/(oauth2|login|logout)(/|$) {
        # De host met poort zoals de browser hem stuurde: de backend leidt er de tenant en de origin van af (BFF).
        proxy_set_header Host $http_host;
        # Door de client gezette doorstuurheaders worden overschreven: nginx is de enige bron van deze waarden. Het sidecar-adres
        # (127.0.0.1/::1) hoort daarom nooit in nl-portal.tenancy.trusted-proxies; zie site/hosting-en-configuratie/tenantbestand-flag-en-secret-store.md.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://localhost:8080;
    }

    # Serve runtime config from /tmp (writable, supports readOnlyRootFilesystem)
    location = /config.js {
        alias /tmp/config.js;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security $hsts always;
    }

    location / {
        add_header Content-Security-Policy "${csp}" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security $hsts always;

        sub_filter_once off;
        sub_filter "##NL_PORTAL_NONCE##" $request_id;

        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html?$args;
    }
}
