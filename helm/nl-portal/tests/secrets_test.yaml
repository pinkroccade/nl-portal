suite: secrets en verplichte waarden
templates:
  - configmap-backend.yaml
  - configmap-frontend.yaml
  - configmap-tenants.yaml
  - service-backend.yaml
  - service-frontend.yaml
  - deployment-backend.yaml
  - deployment-frontend.yaml
  - serviceaccount.yaml
  - ingress.yaml
values:
  - ../ci/minimal-values.yaml
tests:
  - it: faalt als backend.existingSecret ontbreekt
    template: deployment-backend.yaml
    set:
      backend.existingSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: "existingSecret"
  - it: faalt als de Redis-host ontbreekt
    template: deployment-backend.yaml
    set:
      backend.redis.host: ""
    asserts:
      - failedTemplate:
          errorPattern: "redis"
  - it: faalt als de Keycloak-basis-URL ontbreekt
    template: deployment-backend.yaml
    set:
      backend.keycloakBrokerUrl: ""
    asserts:
      - failedTemplate:
          errorPattern: "keycloakBrokerUrl"
  - it: haalt het Redis-wachtwoord uit het bestaande Secret en maakt gebruiker en TLS overschrijfbaar
    template: deployment-backend.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: nl-portal-backend
                key: REDIS_PASSWORD
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_USERNAME
            valueFrom:
              secretKeyRef:
                name: nl-portal-backend
                key: REDIS_USERNAME
                optional: true
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: nl-portal-backend
  - it: zet geen waarden van geheimen in de ConfigMap
    template: configmap-backend.yaml
    asserts:
      - notExists:
          path: data.REDIS_PASSWORD
  - it: laat sleutelnamen per stuk overschrijven
    template: deployment-backend.yaml
    set:
      backend.secretKeys.redisPassword: redis-wachtwoord
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: nl-portal-backend
                key: redis-wachtwoord
  - it: vraagt de geheimen van een module alleen als de module aan staat
    template: deployment-backend.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NLPORTAL_CONFIG_OPENKLANT2_PROPERTIES_TOKEN
            valueFrom:
              secretKeyRef:
                name: nl-portal-backend
                key: NLPORTAL_CONFIG_OPENKLANT2_PROPERTIES_TOKEN
  - it: haalt de geheimen van beheer, Besluiten, OpenKlant en OpenProduct uit het Secret als ze aan staan
    template: deployment-backend.yaml
    values:
      - ../ci/full-values.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NLPORTAL_CONFIG_OPENKLANT2_PROPERTIES_TOKEN
            valueFrom:
              secretKeyRef:
                name: nl-portal-backend
                key: NLPORTAL_CONFIG_OPENKLANT2_PROPERTIES_TOKEN
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NLPORTAL_CONFIG_OPENPRODUCT_PROPERTIES_TOKEN
            valueFrom:
              secretKeyRef:
                name: nl-portal-backend
                key: NLPORTAL_CONFIG_OPENPRODUCT_PROPERTIES_TOKEN
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NLPORTAL_CONFIG_BESLUITENAPI_PROPERTIES_SECRET
            valueFrom:
              secretKeyRef:
                name: nl-portal-backend
                key: NLPORTAL_CONFIG_BESLUITENAPI_PROPERTIES_SECRET
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NLPORTAL_BEHEER_WACHTWOORDHASH
            valueFrom:
              secretKeyRef:
                name: nl-portal-backend
                key: NLPORTAL_BEHEER_WACHTWOORDHASH
