global:
  imageRegistry: registry.example.nl
  imagePullSecrets:
    - regcred
nameOverride: portaal
serviceAccount:
  create: true
  annotations:
    example.nl/role: nl-portal
tenancy:
  tenants:
    base.yaml: |
      omgevingstype: productie
    "00000099000000000001.yaml": |
      oin: "00000099000000000001"
      naam: Gemeente De Bosrand
      domeinen:
        - debosrand.example.nl
  keys:
    - oin: "00000099000000000001"
      existingSecret: nl-portal-key-00000099000000000001
    - oin: "00000099000000000002"
      existingSecret: nl-portal-key-00000099000000000002
      key: sleutel.json
backend:
  replicaCount: 2
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: backend
  existingSecret: nl-portal-backend
  secretVersion: "2026-11-22"
  keycloakBrokerUrl: https://login.example.nl
  trustedProxies: [10.0.0.0/8]
  redis:
    host: redis.example.svc
    username: nlportal
  beheer:
    enabled: true
  cors:
    allowedOrigins: [https://debosrand.example.nl]
  featureFlags:
    flags:
      ops.documentenapis.enabled:
        state: ENABLED
        variants: {"on": true, "off": false}
        defaultVariant: "on"
  frontendProperties:
    messageCountPollingInterval: 30000
  modules:
    zakenapi: {enabled: true}
    catalogiapi: {enabled: true}
    documentenapis: {enabled: true}
    objectenapi: {enabled: true}
    besluitenapi: {enabled: true, url: https://zaken.example.nl, clientId: nl-portal}
    openklant2:
      enabled: true
      contactgegevensApiUrl: https://klant.example.nl/contactgegevens/api/v1
      klantinteractiesApiUrl: https://klant.example.nl/klantinteracties/api/v1
    openproduct:
      enabled: true
      productApiUrl: https://product.example.nl/producten/api/v1
      productTypeApiUrl: https://product.example.nl/producttypen/api/v1
    haalcentraalBrp: {enabled: true}
    clamav: {enabled: true, hostname: clamav.example.svc}
    taak: {enabled: true}
    kvk: {enabled: true}
    verificatie: {enabled: true}
    product:
      enabled: true
      productTypeUrl: https://objecten.example.nl/api/v2/objecttypes/972e92ce-b964-4ca8-ad4d-ddc43dd7b244
      productInstantieTypeUrl: https://objecten.example.nl/api/v2/objecttypes/3e852115-277a-4570-873a-9a64be3aeb34
      productVerbruiksobjectTypeUrl: https://objecten.example.nl/api/v2/objecttypes/3e852115-277a-4570-873a-9a64be3aeb37
      productDetailsTypeUrl: https://objecten.example.nl/api/v2/objecttypes/3e852115-277a-4570-873a-9a64be3aeb36
    prefill:
      enabled: true
      typeUrl: https://objecten.example.nl/api/v2/objecttypes/3e852115-277a-4570-873a-9a64be3aeb37
    dmn:
      enabled: true
      url: https://dmn.example.nl
    berichten: {enabled: true}
    formulieren:
      enabled: true
      formDefinitionObjectTypeUrl: https://objecten.example.nl/api/v2/objecttypes/4b5f4fba-0746-11ed-b939-0242ac120002
  extraEnv:
    - name: SPRING_PROFILES_ACTIVE
      value: extra
frontend:
  replicaCount: 2
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: frontend
  idleTimeoutMinutes: 15
ingress:
  enabled: true
  className: nginx
  hosts: [debosrand.example.nl, anderegemeente.example.nl]
  tls:
    - secretName: nl-portal-tls
      hosts: [debosrand.example.nl, anderegemeente.example.nl]
