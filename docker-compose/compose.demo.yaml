# Demo (niveau 2): de standaardopzet plus Open Zaak, Open Object en Open Notificaties met demo-fixtures, en de modules voor
# zaken en taken aan. De burger ziet zaken en taken.
#
#   docker compose -f compose.yaml -f compose.demo.yaml up -d
#
# De services hieronder horen in compose.yaml bij de profielen openzaak en objecten; hier starten ze altijd. De koppelingen
# (Open Zaak, Open Object) staan in het tenantbestand imports/tenants/.

x-altijd: &altijd
    profiles: !reset []

services:
    nl-portal-openzaak: *altijd
    nl-portal-openzaak-import: *altijd
    nl-portal-openzaak-database: *altijd
    nl-portal-open-object: *altijd
    nl-portal-open-object-celery: *altijd
    nl-portal-open-object-database: *altijd
    nl-portal-open-object-import: *altijd
    nl-portal-open-notificaties: *altijd
    nl-portal-open-notificaties-import: *altijd
    nl-portal-open-notificaties-celery: *altijd
    nl-portal-open-notificaties-database: *altijd
    nl-portal-open-notificaties-rabbitmq: *altijd
    nl-portal-redis: *altijd
    # Open Klant: de contactgegevens (e-mail, telefoon) op Mijn gegevens; zonder Open Klant meldt die pagina dat niet alle gegevens zijn opgehaald.
    nl-portal-openklant-2: *altijd
    nl-portal-openklant-2-import: *altijd
    nl-portal-openklant-2-db: *altijd

    # BRP- en Bewoning-mock met eigen demodata: Merel Kooyman (BSN 999993847) woont met partner en drie minderjarige kinderen op
    # een adres (imports/haalcentraal/).
    nl-portal-haalcentraal-personen:
        profiles: !reset []
        volumes:
            - ./imports/haalcentraal/personen-test-data.json:/app/Data/test-data.json:ro

    nl-portal-haalcentraal-bewoningen:
        profiles: !reset []
        volumes:
            - ./imports/haalcentraal/bewoning-test-data.json:/app/Data/test-data.json:ro

    # Landingspagina die de backoffice (bijvoorbeeld het Sociaal Portaal) voorstelt: de taak-link uit Open Object wijst hiernaartoe.
    # Zie voorbeelden/taak/taak-aanmaken.sh.
    nl-portal-sociaal-portaal-mock:
        container_name: nl-portal-sociaal-portaal-mock
        image: nginx:1.27-alpine
        ports:
            - "127.0.0.1:${SOCIAAL_PORTAAL_MOCK_PORT:-8095}:80"
        volumes:
            - ./imports/sociaal-portaal-mock:/usr/share/nginx/html:ro

    nl-portal-backend:
        environment:
            NLPORTAL_FEATUREFLAGS_FILE: /etc/nl-portal/flags/nl-portal.demo.flagd.json
