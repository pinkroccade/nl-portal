# Fictieve demo-tenant Gemeente De Bosrand. Het OIN is fictief en moet tussen aanhalingstekens staan.
oin: "00000099000000000001"
naam: Gemeente De Bosrand
domeinen:
    - localhost
thema:
    titel: Mijn De Bosrand

koppelingen:
    brp:
        url: http://localhost:5010/haalcentraal/api/brp
        leverancier: Haal Centraal BRP-mock
        auth:
            # Geen sleutel: de mocks vragen er geen; in productie authenticeert de cloud gateway.
            type: geen
    brp-bewoning:
        url: http://localhost:5011/haalcentraal/api/bewoning
        leverancier: Haal Centraal Bewoning-mock
        auth:
            # Geen sleutel: de mocks vragen er geen; in productie authenticeert de cloud gateway.
            type: geen
    # Handelsregister (KvK, optioneel): haal de commentaartekens weg, zet het geheim in backend.env en zet NLPORTAL_CONFIG_KVK_ENABLED=true.
    # kvk:
    #     url: https://api.kvk.nl/api/v1
    #     leverancier: KvK
    #     auth:
    #         type: api-key
    #         headerNaam: X-API-KEY
    #         waarde: 00000099000000000001.kvk-sleutel
    zakenapi:
        url: http://localhost:8001
        auth:
            type: zgw-jwt
            clientId: nl-portal
            secret: 00000099000000000001.zaken-secret
    # Betalen via Worldline Direct (optioneel): haal de commentaartekens weg, ook bij modules hieronder, en zet de geheimen in backend.env.
    # payment-direct:
    #     url: https://payment.preprod.direct.worldline-solutions.com
    #     auth:
    #         type: gcs-v1-hmac
    #         clientId: <API-sleutel-ID van de provider>
    #         secret: 00000099000000000001.payment-direct-api-geheim
modules:
    brp:
        # Doelbinding BRP per gemeente; leeg of weglaten geeft de standaardvelden en alle woonplaatsen.
        toegestaneWoonplaatsenBewoning: []
    zakenapi:
        nnpKvkQueryIdentificatoren: false
