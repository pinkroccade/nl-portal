# NL Portal: standaardopzet met portal, Keycloak en de sessiestore van de BFF (ADR 0022).
# Optionele profielen: brp-mock, bewoning, openzaak, objecten, openklant, openproduct, clamav.
# Demo met zaken en taken: compose.demo.yaml. Backend en frontend met debugger: compose.dev.yaml. Zie README.md.
#
# Elke service heeft een eigen hostname op het benoemde netwerk en publiceert zijn eigen poort op 127.0.0.1 (instelbaar via .env).
# De browser bereikt Keycloak op http://localhost:8082; de backend bereikt het via het netwerk (tenantbestand: interneBasisUrl).
name: nl-portal

networks:
    default:
        # Benoemd en gedeeld met het mijngemeente-ecosysteem: een eigen compose (bijvoorbeeld een mock) of een
        # andere applicatie sluit er als extern netwerk op aan.
        name: ${NL_PORTAL_NETWORK:-mijngemeente}

services:

    nl-portal-frontend:
        image: ${NL_PORTAL_FRONTEND_IMAGE:-nl-portal-frontend:dev}
        build: ../frontend
        pull_policy: never
        container_name: nl-portal-frontend
        env_file: imports/frontend.env
        environment:
            # De nginx van de frontend stuurt /graphql, /api, /oauth2, /login en /logout naar de backend (same-origin, BFF).
            NL_PORTAL_BACKEND_UPSTREAM: nl-portal-backend:8080
        depends_on:
            - nl-portal-backend
        ports:
            - "127.0.0.1:${FRONTEND_PORT:-3000}:8081"

    nl-portal-backend:
        image: ${NL_PORTAL_BACKEND_IMAGE:-nl-portal-backend:dev}
        build: ../backend
        pull_policy: never
        container_name: nl-portal-backend
        env_file: imports/backend.env
        # De clientsleutel is 0600 van de gebruiker die `mise run dev:setup` draaide; de container leest hem als diezelfde uid (Linux).
        user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
        depends_on:
            nl-portal-sessies:
                condition: service_healthy
            nl-portal-keycloak-config:
                condition: service_completed_successfully
        environment:
            # De BFF (ADR 0022): sessies in Redis met ACL, en de publieke basis-URL van Keycloak waaronder elke issuer valt.
            REDIS_HOST: nl-portal-sessies
            REDIS_USERNAME: nlportal
            # De Redis van de compose-stack praat geen TLS; buiten lokaal staat REDIS_SSL standaard aan.
            REDIS_SSL: "false"
            REDIS_PASSWORD: ${REDIS_PASSWORD:?draai eerst mise run dev:setup}
            KEYCLOAK_BROKER_URL: http://localhost:${KEYCLOAK_PORT:-8082}
            NL_PORTAL_GEHEIMEN_00000099000000000001_OBJECTENAPI_TOKEN: "Token ${OBJECTS_API_TOKEN:?draai eerst mise run dev:setup}"
            NL_PORTAL_GEHEIMEN_00000099000000000001_ZAKEN_SECRET: "${OPENZAAK_NLPORTAL_SECRET:?draai eerst mise run dev:setup}"
            NL_PORTAL_GEHEIMEN_00000099000000000001_CATALOGIAPI_SECRET: "${OPENZAAK_NLPORTAL_SECRET:?draai eerst mise run dev:setup}"
            NLPORTAL_CONFIG_BESLUITENAPI_PROPERTIES_SECRET: "${OPENZAAK_NLPORTAL_SECRET:?draai eerst mise run dev:setup}"
            NL_PORTAL_GEHEIMEN_00000099000000000001_DOCUMENTEN_API_SECRET: "${OPENZAAK_NLPORTAL_SECRET:?draai eerst mise run dev:setup}"
            NL_PORTAL_GEHEIMEN_00000099000000000001_DOCUMENTEN_DUMMYDOC_SECRET: "${OPENZAAK_NLPORTAL_SECRET:?draai eerst mise run dev:setup}"
            NL_PORTAL_GEHEIMEN_00000099000000000001_VERIFICATIE_SECRET: "${OPENZAAK_NLPORTAL_SECRET:?draai eerst mise run dev:setup}"
            NL_PORTAL_GEHEIMEN_00000099000000000001_VERIFICATIE_APIKEY: "${OPENZAAK_NLPORTAL_SECRET:?draai eerst mise run dev:setup}"
            NLPORTAL_CONFIG_OPENKLANT2_PROPERTIES_TOKEN: "${OPENKLANT_API_TOKEN:?draai eerst mise run dev:setup}"
            NLPORTAL_BEHEER_WACHTWOORDHASH: "{noop}${BACKEND_BEHEER_PASSWORD:?draai eerst mise run dev:setup}"
            NLPORTAL_FEATUREFLAGS_FILE: /etc/nl-portal/flags/nl-portal.flagd.json
            NL_PORTAL_TENANTS_DIRECTORY: /etc/nl-portal/imports/tenants
            NL_PORTAL_SLEUTELMAP: /etc/nl-portal/sleutels
            SPRING_CONFIG_IMPORT: optional:configtree:/etc/nl-portal/koppelingen/
        volumes:
            - ./imports/flags:/etc/nl-portal/flags:ro
            - ./imports/koppelingen:/etc/nl-portal/koppelingen:ro
            # De map met tenantbestanden en de sleutelmap met de gegenereerde clientsleutel per tenant (<oin>/clientsleutel.jwk.json).
            - ./imports/tenants:/etc/nl-portal/imports/tenants:ro
            - ./.generated/tenants:/etc/nl-portal/sleutels:ro
        ports:
            - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
            - "127.0.0.1:${BEHEER_PORT:-8091}:8091"

    # Sessies van de BFF (ADR 0022): Redis met ACL (de default-gebruiker staat uit, alleen `nlportal`), zonder persistentie en met
    # noeviction, zodat een volle Redis sessies niet ongemerkt weggooit voor hun TTL. Elke sleutel heeft een TTL (Spring Session en
    # de pre-auth-sessie). Eén instantie per cel; lokaal alleen op 127.0.0.1 gepubliceerd voor `bootRun`. De ACL staat in
    # templates/redis/users.acl (een ACL-bestand kent geen commentaar): de default-gebruiker uit, `nlportal` alleen op de
    # sleutels `nlp:*` en `spring:session:*` en zonder admin-, gevaarlijke en scriptcommando's.
    nl-portal-sessies:
        container_name: nl-portal-sessies
        image: redis:8.10-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
        command: ["redis-server", "--aclfile", "/etc/redis/users.acl", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
        ports:
            - "127.0.0.1:6379:6379"
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:?draai eerst mise run dev:setup}
        volumes:
            - ./.generated/redis/users.acl:/etc/redis/users.acl:ro
        healthcheck:
            test: ["CMD-SHELL", "redis-cli --user nlportal --pass \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            interval: 5s
            timeout: 3s
            retries: 10

    # Eigen Keycloak-image met de NL Portal-mappers (keycloak/, #527): bouw het eerst met `mise run keycloak:image`.
    # Draait geoptimaliseerd (`start --optimized`): de bouwopties (postgres, health) zitten in het image.
    nl-portal-keycloak:
        container_name: nl-portal-keycloak
        ports:
            - "127.0.0.1:${KEYCLOAK_PORT:-8082}:8082"
        depends_on:
            - nl-portal-keycloak-database
        image: ${NL_PORTAL_KEYCLOAK_IMAGE:-nl-portal-keycloak:dev}
        pull_policy: never
        environment:
            KC_DB_URL: jdbc:postgresql://nl-portal-keycloak-database/keycloak
            KC_DB_USERNAME: keycloak
            KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?draai eerst mise run dev:setup}
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?draai eerst mise run dev:setup}
            # Lokaal over http; buiten ontwikkeling zit Keycloak achter TLS (sslRequired: all in het realm).
            KC_HTTP_ENABLED: "true"
            KC_HTTP_PORT: "8082"
            # Vaste publieke URL: de issuer is altijd localhost, ook bij verzoeken van de backend via het interne netwerk.
            KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8082}
            KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
        command: ["start", "--optimized"]
        healthcheck:
            # De image heeft geen curl; bash praat zelf HTTP met de beheerpoort (9000).
            test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
            interval: 5s
            timeout: 5s
            retries: 40
            start_period: 10s

    # Laadt het realm van elke tenant (docker-compose/.generated/keycloak/<oin>.json, gemaakt door `mise run dev:setup` uit
    # keycloak/realm-template en de tenantbestanden) in Keycloak en stopt. Draai opnieuw (`docker compose run --rm
    # nl-portal-keycloak-config`) na een wijziging: kcc herstelt ook handmatige afwijkingen (IMPORT_CACHE_ENABLED=false).
    # keycloak-config-cli 6.5.1-26.5.5 is de nieuwste tag; Keycloak 26.8 staat niet in zijn CI-matrix maar werkt (research-notitie
    # kcc-keycloak-26-8-private-key-jwt). Pin op digest; bump alleen samen met Keycloak en de integratietest (mise run keycloak:integration-test).
    nl-portal-keycloak-config:
        container_name: nl-portal-keycloak-config
        image: adorsys/keycloak-config-cli@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274 # 6.5.1-26.5.5
        depends_on:
            nl-portal-keycloak:
                condition: service_healthy
        restart: "no"
        environment:
            KEYCLOAK_URL: http://nl-portal-keycloak:8082
            KEYCLOAK_USER: admin
            KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?draai eerst mise run dev:setup}
            KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
            KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 180s
            IMPORT_FILES_LOCATIONS: /config/*.json
            IMPORT_CACHE_ENABLED: "false"
            IMPORT_VAR_SUBSTITUTION_ENABLED: "true"
            IMPORT_VAR_SUBSTITUTION_UNDEFINED_THROWS_EXCEPTIONS: "true"
            # Zodra een tenant het inlogmiddel yivi aanzet hoort hier ook KEYCLOAK_YIVI_CLIENT_SECRET: kcc breekt anders op de
            # ontbrekende variabele (UNDEFINED_THROWS_EXCEPTIONS).
        volumes:
            - ./.generated/keycloak:/config:ro

    nl-portal-keycloak-database:
        container_name: nl-portal-keycloak-database
        image: postgres:15
        environment:
            POSTGRES_USER: keycloak
            POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?draai eerst mise run dev:setup}

    nl-portal-openzaak:
        image: openzaak/open-zaak:1.31.2
        container_name: nl-portal-openzaak
        ports:
            - "127.0.0.1:${OPENZAAK_PORT:-8001}:8001"
        platform: linux/amd64
        profiles:
            - openzaak
        environment: &openzaak-env
            - OPENZAAK_PORT=8001
            - OTEL_SDK_DISABLED=true
            - DB_HOST=nl-portal-openzaak-database
            - DB_PORT=5432
            - SECRET_KEY=${OPENZAAK_SECRET_KEY:?draai eerst mise run dev:setup}
            - DB_USER=openzaak
            - DB_PASSWORD=${OPENZAAK_DB_PASSWORD:?draai eerst mise run dev:setup}
            - DB_NAME=openzaak
            - CACHE_DEFAULT=nl-portal-redis:6379/0
            - CACHE_AXES=nl-portal-redis:6379/0
            - DEBUG=true
            - ALLOWED_HOSTS=localhost,host.docker.internal,172.17.0.1,openzaak,example.com
            - OPENZAAK_SUPERUSER_USERNAME=admin
            - OPENZAAK_SUPERUSER_EMAIL=admin@example.org
            - CELERY_BROKER_URL=redis://nl-portal-redis:6379/1
            - CELERY_RESULT_BACKEND=redis://nl-portal-redis:6379/1
            - DJANGO_SUPERUSER_PASSWORD=${OPENZAAK_ADMIN_PASSWORD:?draai eerst mise run dev:setup}
            - SENDFILE_BACKEND=django_sendfile.backends.simple
            - DISABLE_2FA=true
        depends_on:
            - nl-portal-openzaak-database
            - nl-portal-redis
        volumes:
            - openzaak-private-media:/app/private-media

    nl-portal-openzaak-import:
        image: openzaak/open-zaak:1.31.2
        container_name: nl-portal-openzaak-import
        platform: linux/amd64
        profiles:
            - openzaak
        environment: *openzaak-env
        command: sh init/init.sh
        volumes:
            - ./imports/openzaak/fixtures:/app/src/openzaak/fixtures
            - ./imports/openzaak/init:/app/init
            - ./.generated/openzaak:/app/generated:ro
            - ./imports/openzaak/media:/app/fixture-media:ro
            - openzaak-private-media:/app/private-media
        depends_on:
            - nl-portal-openzaak
            - nl-portal-openzaak-database
            - nl-portal-redis

    nl-portal-openzaak-database:
        image: postgis/postgis:15-3.5
        container_name: nl-portal-openzaak-database
        platform: linux/amd64
        profiles:
            - openzaak
        environment:
            - POSTGRES_USER=openzaak
            - POSTGRES_PASSWORD=${OPENZAAK_DB_PASSWORD:?draai eerst mise run dev:setup}
            - POSTGRES_DB=openzaak

    nl-portal-openklant-2:
        image: maykinmedia/open-klant:2.19.2
        container_name: nl-portal-openklant-2
        ports:
            - "127.0.0.1:${OPENKLANT_PORT:-8014}:8014"
        profiles:
            - openklant
        depends_on:
            - nl-portal-openklant-2-db
            - nl-portal-redis
        environment: &openklant-2-env
            - OPENKLANT_PORT=8014
            - OTEL_SDK_DISABLED=true
            - DJANGO_SETTINGS_MODULE=openklant.conf.docker
            - IS_HTTPS=no
            - DB_NAME=openklant
            - DB_USER=openklant
            - DB_PASSWORD=${OPENKLANT_DB_PASSWORD:?draai eerst mise run dev:setup}
            - DB_HOST=nl-portal-openklant-2-db
            - ALLOWED_HOSTS=*
            - CACHE_DEFAULT=nl-portal-redis:6379/2
            - CACHE_AXES=nl-portal-redis:6379/2
            - SUBPATH=${SUBPATH:-/}
            - SECRET_KEY=${OPENKLANT_SECRET_KEY:?draai eerst mise run dev:setup}
            - CELERY_BROKER_URL=redis://nl-portal-redis:6379/3
            - CELERY_RESULT_BACKEND=redis://nl-portal-redis:6379/3
            - DISABLE_2FA=true
        volumes:
            - ./imports/openklant-2/fixtures:/app/src/openklant/fixtures

    nl-portal-openklant-2-import:
        image: maykinmedia/open-klant:2.19.2
        container_name: nl-portal-openklant-2-import
        profiles:
            - openklant
        environment: *openklant-2-env
        command: sh init/init.sh
        volumes:
            - ./imports/openklant-2/fixtures:/app/src/openklant/fixtures
            - ./imports/openklant-2/init:/app/init
            - ./.generated/openklant-2:/app/generated:ro
        depends_on:
            - nl-portal-openklant-2
            - nl-portal-openklant-2-db
            - nl-portal-redis

    nl-portal-openklant-2-db:
        image: postgres:15
        container_name: nl-portal-openklant-2-db
        profiles:
            - openklant
        environment:
            - POSTGRES_USER=openklant
            - POSTGRES_PASSWORD=${OPENKLANT_DB_PASSWORD:?draai eerst mise run dev:setup}
            - POSTGRES_DB=openklant

    nl-portal-open-object:
        image: maykinmedia/open-object:4.3.0
        container_name: nl-portal-open-object
        ports:
            - "127.0.0.1:${OPEN_OBJECT_PORT:-8010}:8010"
        platform: linux/amd64
        profiles:
            - objecten
        environment: &objects-env
            - OPENOBJECT_PORT=8010
            - OTEL_SDK_DISABLED=true
            - CORS_ALLOW_ALL_ORIGINS=true
            - SECRET_KEY=${OBJECTS_SECRET_KEY:?draai eerst mise run dev:setup}
            - DJANGO_SETTINGS_MODULE=objects.conf.docker
            - DB_HOST=nl-portal-open-object-database
            - DB_PASSWORD=${OBJECTS_DB_PASSWORD:?draai eerst mise run dev:setup}
            - DEBUG=true
            - TWO_FACTOR_FORCE_OTP_ADMIN=False
            - TWO_FACTOR_PATCH_ADMIN=False
            - DISABLE_2FA=true
            - CACHE_AXES=nl-portal-redis:6379/4
            - CACHE_DEFAULT=nl-portal-redis:6379/4
            - ALLOWED_HOSTS=localhost,host.docker.internal,172.17.0.1
            - CELERY_BROKER_URL=redis://nl-portal-redis:6379/5
            - CELERY_RESULT_EXPIRES=3600
            - CELERY_RESULT_BACKEND=redis://nl-portal-redis:6379/5
            - CELERY_LOGLEVEL=DEBUG
            - SITE_DOMAIN=localhost:8010
            - OTEL_SERVICE_NAME=open-object
            - OBJECTS_SUPERUSER_USERNAME=admin
            - OBJECTS_SUPERUSER_EMAIL=admin@example.org
            - OBJECTS_SUPERUSER_PASSWORD=${OBJECTS_ADMIN_PASSWORD:?draai eerst mise run dev:setup}
        depends_on:
            - nl-portal-open-object-database
            - nl-portal-redis

    nl-portal-open-object-celery:
        image: maykinmedia/open-object:4.3.0
        container_name: nl-portal-open-object-celery
        platform: linux/amd64
        profiles:
            - objecten
        depends_on:
            - nl-portal-open-object
            - nl-portal-open-object-database
            - nl-portal-redis
        command: /celery_worker.sh
        environment: *objects-env

    nl-portal-open-object-database:
        image: postgis/postgis:15-3.5
        container_name: nl-portal-open-object-database
        platform: linux/amd64
        profiles:
            - objecten
        environment:
            - POSTGRES_USER=objects
            - POSTGRES_PASSWORD=${OBJECTS_DB_PASSWORD:?draai eerst mise run dev:setup}
            - POSTGRES_DB=objects

    nl-portal-open-object-import:
        image: maykinmedia/open-object:4.3.0
        container_name: nl-portal-open-object-import
        platform: linux/amd64
        profiles:
            - objecten
        environment: *objects-env
        command: sh init/init.sh
        volumes:
            - ./imports/open-object/fixtures:/app/src/objects/fixtures
            - ./imports/open-object/init:/app/init
            - ./.generated/open-object:/app/generated:ro
        depends_on:
            - nl-portal-open-object
            - nl-portal-open-object-database

    nl-portal-open-notificaties:
        image: openzaak/open-notificaties:1.17.0
        container_name: nl-portal-open-notificaties
        ports:
            - "127.0.0.1:${OPEN_NOTIFICATIES_PORT:-8012}:8012"
        platform: linux/amd64
        profiles:
            - objecten
        environment: &notificaties-env
            - OPENNOTIFICATIES_PORT=8012
            - OTEL_SDK_DISABLED=true
            - DJANGO_SETTINGS_MODULE=nrc.conf.docker
            - SECRET_KEY=${NOTIFICATIES_SECRET_KEY:?draai eerst mise run dev:setup}
            - ALLOWED_HOSTS=*
            - CACHE_DEFAULT=nl-portal-redis:6379/7
            - CACHE_AXES=nl-portal-redis:6379/7
            - DB_PORT=5432
            - DB_HOST=nl-portal-open-notificaties-database
            - DB_NAME=notifications
            - DB_USER=notifications
            - DB_PASSWORD=${NOTIFICATIES_DB_PASSWORD:?draai eerst mise run dev:setup}
            - RABBITMQ_HOST=open-notificaties-rabbitmq
            - PUBLISH_BROKER_URL=amqp://notificaties:${NOTIFICATIES_RABBITMQ_PASSWORD:?draai eerst mise run dev:setup}@nl-portal-open-notificaties-rabbitmq:5672//
            - CELERY_BROKER_URL=amqp://notificaties:${NOTIFICATIES_RABBITMQ_PASSWORD:?draai eerst mise run dev:setup}@nl-portal-open-notificaties-rabbitmq:5672//
            - CELERY_RESULT_BACKEND=redis://nl-portal-redis:6379/8
            - CELERY_LOGLEVEL=DEBUG
            - CELERY_WORKER_CONCURRENCY=${CELERY_WORKER_CONCURRENCY:-4}
            - OPENNOTIFICATIES_SUPERUSER_USERNAME=admin
            - OPENNOTIFICATIES_SUPERUSER_EMAIL=admin@localhost
            - DJANGO_SUPERUSER_PASSWORD=${NOTIFICATIES_ADMIN_PASSWORD:?draai eerst mise run dev:setup}
            - LOG_NOTIFICATIONS_IN_DB=yes
            - DISABLE_2FA=true

    nl-portal-open-notificaties-import:
        image: openzaak/open-notificaties:1.17.0
        container_name: nl-portal-open-notificaties-import
        platform: linux/amd64
        profiles:
            - objecten
        command: sh init/init.sh
        volumes:
            - ./imports/open-notificaties/fixtures:/app/src/nrc/fixtures
            - ./imports/open-notificaties/init:/app/init
            - ./.generated/open-notificaties:/app/generated:ro
        depends_on:
            - nl-portal-open-notificaties
            - nl-portal-open-notificaties-database
        environment: *notificaties-env

    nl-portal-open-notificaties-celery:
        image: openzaak/open-notificaties:1.17.0
        container_name: nl-portal-open-notificaties-celery
        platform: linux/amd64
        profiles:
            - objecten
        command: /celery_worker.sh
        healthcheck:
            test: [ "CMD", "python", "/app/bin/check_celery_worker_liveness.py" ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        environment: *notificaties-env

    nl-portal-open-notificaties-database:
        image: postgis/postgis:15-3.5
        container_name: nl-portal-open-notificaties-database
        platform: linux/amd64
        profiles:
            - objecten
        environment:
            - POSTGRES_USER=notifications
            - POSTGRES_PASSWORD=${NOTIFICATIES_DB_PASSWORD:?draai eerst mise run dev:setup}
            - POSTGRES_DB=notifications

    nl-portal-open-notificaties-rabbitmq:
        image: rabbitmq:3.13-management
        container_name: nl-portal-open-notificaties-rabbitmq
        profiles:
            -   objecten
        environment:
            - RABBITMQ_DEFAULT_USER=notificaties
            - RABBITMQ_DEFAULT_PASS=${NOTIFICATIES_RABBITMQ_PASSWORD:?draai eerst mise run dev:setup}

    nl-portal-openproduct:
        image: maykinmedia/open-product:1.10.0
        container_name: nl-portal-openproduct
        ports:
            - "127.0.0.1:${OPENPRODUCT_PORT:-8015}:8015"
        profiles:
            - openproduct
        platform: linux/amd64
        depends_on:
            - nl-portal-openproduct-database
            - nl-portal-redis
        environment: &open-product-env
            - OPENPRODUCT_PORT=8015
            - OTEL_SDK_DISABLED=true
            - DJANGO_SETTINGS_MODULE=openproduct.conf.docker
            - SECRET_KEY=${OPENPRODUCT_SECRET_KEY:?draai eerst mise run dev:setup}
            - DB_NAME=openproduct
            - DB_USER=openproduct
            - DB_PASSWORD=${OPENPRODUCT_DB_PASSWORD:?draai eerst mise run dev:setup}
            - DB_HOST=nl-portal-openproduct-database
            - DB_PORT=5432
            - CACHE_DEFAULT=nl-portal-redis:6379/9
            - CACHE_AXES=nl-portal-redis:6379/11
            - CELERY_BROKER_URL=redis://nl-portal-redis:6379/10
            - CELERY_RESULT_BACKEND=redis://nl-portal-redis:6379/10
            - ALLOWED_HOSTS=*
            - DISABLE_2FA=true
            - OPENPRODUCT_SUPERUSER_USERNAME=admin
            - OPENPRODUCT_SUPERUSER_EMAIL=admin@example.org
            - OPENPRODUCT_SUPERUSER_PASSWORD=${OPENPRODUCT_ADMIN_PASSWORD:?draai eerst mise run dev:setup}

    nl-portal-openproduct-import:
        image: maykinmedia/open-product:1.10.0
        container_name: nl-portal-openproduct-import
        platform: linux/amd64
        profiles:
            - openproduct
        environment: *open-product-env
        command: sh init/init.sh
        volumes:
            - ./imports/openproduct/fixtures:/app/src/openproduct/fixtures
            - ./imports/openproduct/init:/app/init
            - ./.generated/openproduct:/app/generated:ro
        depends_on:
            - nl-portal-openproduct
            - nl-portal-openproduct-database
            - nl-portal-redis

    nl-portal-openproduct-celery:
        image: maykinmedia/open-product:1.10.0
        container_name: nl-portal-openproduct-celery
        platform: linux/amd64
        profiles:
            - openproduct
        command: /celery_worker.sh
        environment: *open-product-env

    nl-portal-openproduct-database:
        image: postgres:17
        container_name: nl-portal-openproduct-database
        profiles:
            - openproduct
        environment:
            - POSTGRES_USER=${DB_USER:-openproduct}
            - POSTGRES_PASSWORD=${OPENPRODUCT_DB_PASSWORD:?draai eerst mise run dev:setup}
            - POSTGRES_DB=openproduct

    nl-portal-redis:
        image: redis:6.2.24
        container_name: nl-portal-redis
        profiles:
            - openzaak
            - objecten
            - openproduct
            - openklant

    nl-portal-haalcentraal-personen:
        container_name: nl-portal-haalcentraal-personen
        ports:
            - "127.0.0.1:${BRP_MOCK_PORT:-5010}:5010"
        profiles:
            - brp-mock
        image: ghcr.io/brp-api/personen-mock:2.2.1
        environment:
            - ASPNETCORE_ENVIRONMENT=Release
            - ASPNETCORE_URLS=http://+:5010

    nl-portal-haalcentraal-bewoningen:
        container_name: nl-portal-haalcentraal-bewoningen
        ports:
            - "127.0.0.1:${BEWONING_MOCK_PORT:-5011}:5011"
        profiles:
            - bewoning
        image: ghcr.io/brp-api/haal-centraal-bewoning-bevragen-mock:2.0.1
        environment:
            - ASPNETCORE_ENVIRONMENT=Release
            - ASPNETCORE_URLS=http://+:5011

    nl-portal-clamav:
        container_name: nl-portal-clamav
        ports:
            - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
        image: clamav/clamav:latest
        platform: linux/amd64
        profiles:
            - clamav
        healthcheck:
            test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 120s

volumes:
    # Bestanden van Open Zaak: een named volume neemt de rechten van de image over (een bind mount geeft op Linux een PermissionError).
    openzaak-private-media:
