# Overlay voor performancetesten (zie site/development/adr/0018-performancetesten-met-k6-en-otel-agent-in-overlay.md).
#
# Gebruik naast compose.yaml en compose.demo.yaml; de overlay bouwt backend en frontend uit de sources en
# zet de BRP-mock aan met data per seed-gebruiker:
#
#   Baseline (zonder tracing):
#     docker compose -f compose.yaml -f compose.demo.yaml -f compose.perf.yaml up -d --build
#   Diagnose (100% tracing naar Tempo):
#     PERF_JAVA_AGENT=true PERF_OTEL_SDK_DISABLED=false COMPOSE_PROFILES=tracing \
#       docker compose -f compose.yaml -f compose.demo.yaml -f compose.perf.yaml up -d --build
#
# `mise run perf:stack-up` en `mise run perf:stack-up-tracing` doen dit voor je.
#
# De OpenTelemetry Java-agent wordt alleen hier toegevoegd, via een volume: het release-artefact
# (de backend-image) bevat geen tracing-dependency. Zonder die variabelen (en zonder profiel `tracing`) staat tracing uit en
# gedraagt de stack zich als de gewone stack, zodat baselineruns niet door de agent worden vertekend.
services:
    # Eenmalig: kopieert de OTel Java-agent naar een gedeeld volume, zodat de backend-image ongewijzigd blijft.
    otel-javaagent:
        image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.20.1
        container_name: nl-portal-otel-javaagent
        profiles:
            - tracing
        command: ["cp", "/javaagent.jar", "/otel/javaagent.jar"]
        volumes:
            - otel-agent:/otel

    nl-portal-tempo:
        image: grafana/tempo:2.10.10
        container_name: nl-portal-tempo
        profiles:
            - tracing
        command: ["-config.file=/etc/tempo/tempo.yaml"]
        volumes:
            - ./imports/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
            - type: tmpfs
              target: /var/tempo
              tmpfs:
                  mode: 01777
        ports:
            - "127.0.0.1:3200:3200" # Tempo query API (trace opvragen via /api/traces/<id>)

    nl-portal-backend:
        image: nl-portal-backend:perf
        build: ../backend
        # De backend heeft Keycloak nodig bij het opstarten en stopt zonder dat; compose start hem niet opnieuw.
        # Op een trage (CI-)runner kan hij daardoor eenmalig mislukken, dus herstart hem een paar keer.
        restart: on-failure:5
        environment:
            NLPORTAL_CONFIG_HAALCENTRAALBRP_PROPERTIES_BRPAPIURL: http://nl-portal-haalcentraal-personen:5010/haalcentraal/api/brp/
            # Leeg zonder tracing: dan wordt geen agent geladen.
            JAVA_TOOL_OPTIONS: ${PERF_JAVA_AGENT:+-javaagent:/otel/javaagent.jar}
            OTEL_SDK_DISABLED: "${PERF_OTEL_SDK_DISABLED:-true}"
            OTEL_SERVICE_NAME: nl-portal-backend
            OTEL_TRACES_SAMPLER: always_on
            OTEL_METRICS_EXPORTER: none
            OTEL_LOGS_EXPORTER: none
            OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
            OTEL_EXPORTER_OTLP_ENDPOINT: http://nl-portal-tempo:4318
            OTEL_PROPAGATORS: tracecontext,baggage
        volumes:
            - otel-agent:/otel:ro
        depends_on:
            otel-javaagent:
                condition: service_completed_successfully
                required: false

    nl-portal-frontend:
        image: nl-portal-frontend:perf
        build: ../frontend

    # OpenZaak en Objecten hebben OTel al ingebouwd (in de basis staat OTEL_SDK_DISABLED=true).
    nl-portal-openzaak:
        environment:
            - OTEL_SDK_DISABLED=${PERF_OTEL_SDK_DISABLED:-true}
            - OTEL_SERVICE_NAME=open-zaak
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://nl-portal-tempo:4317
            - OTEL_EXPORTER_OTLP_PROTOCOL=grpc

    nl-portal-open-object:
        environment:
            - OTEL_SDK_DISABLED=${PERF_OTEL_SDK_DISABLED:-true}
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://nl-portal-tempo:4317
            - OTEL_EXPORTER_OTLP_PROTOCOL=grpc

    # De seed-gebruikers (burger-001.., BSN's vanaf 900000000) staan niet in de demodata van de BRP-mock.
    # Dit bestand (gegenereerd met `mise run perf:brp-data`) vervangt de mock-data door een persoon per seed-gebruiker.
    nl-portal-haalcentraal-personen:
        profiles: !reset []
        volumes:
            - ./imports/haalcentraal-perf/test-data.json:/app/Data/test-data.json:ro

volumes:
    otel-agent:
