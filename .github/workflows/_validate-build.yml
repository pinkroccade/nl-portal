name: _validate-build

on:
    workflow_call:
        inputs:
            nodeVersion:
                type: string
                default: "24"
            runBackend:
                description: "Build+test the backend stack."
                type: boolean
                default: true
            runFrontend:
                description: "Build+test the frontend stack."
                type: boolean
                default: true
        secrets:
            SONARCLOUD_TOKEN:
                description: "Token voor de SonarCloud-analyse van de backend; zonder token (fork-PR) wordt die overgeslagen."
                required: false

permissions:
    contents: read
    pull-requests: read # SonarCloud leest de PR-gegevens

jobs:
    build-be:
        if: ${{ inputs.runBackend }}
        runs-on: ubuntu-latest
        env:
            # Alleen PR's uit deze repository hebben toegang tot het token.
            SONAR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
                    fetch-depth: 0 # SonarCloud heeft de historie nodig voor blame en nieuwe code
            -   name: Set up mise (java uit mise.toml)
                uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
                with:
                    install_args: "java"
            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
            -   name: Build, test and lint
                run: mise run backend:check
            # Hergebruikt de testresultaten van de build hierboven: de unit-tests zijn dan UP-TO-DATE en
            # draaien niet nog eens (#651). Informatief, zoals de aparte Sonar-workflow dat was: geen
            # required check, dus een falende analyse blokkeert de PR niet.
            -   name: SonarCloud analysis
                id: sonar
                if: ${{ env.SONAR == 'true' }}
                continue-on-error: true
                env:
                    SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: mise run backend:sonar
            -   name: Wait for SonarCloud quality gate
                if: ${{ steps.sonar.outcome == 'success' }}
                continue-on-error: true
                uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
                timeout-minutes: 10
                env:
                    SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
                with:
                    scanMetadataReportFile: backend/build/sonar/report-task.txt
            # New modules or layer changes in ModuleLayers are architecture decisions; summarise them
            # in plain language for the PR (#177). ci.yml posts the summary as a PR comment.
            # Informational only: a failure here must not block the PR gate.
            -   name: Summarise module layer changes
                id: module-layers
                if: ${{ github.event_name == 'pull_request' }}
                continue-on-error: true
                env:
                    BASE_REF: ${{ github.base_ref }}
                    MODULE_LAYERS_BASE_REF: FETCH_HEAD
                run: |
                    git fetch --no-tags --depth=1 origin "${BASE_REF}"
                    mise run backend:module-layer-changes
                    cat backend/architecture-test/build/reports/module-layers/pr-summary.md >> "${GITHUB_STEP_SUMMARY}"
            -   name: Upload module layer summary
                if: ${{ steps.module-layers.outcome == 'success' }}
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: module-layers-summary
                    path: backend/architecture-test/build/reports/module-layers/pr-summary.md
                    if-no-files-found: error

    build-fe:
        if: ${{ inputs.runFrontend }}
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   name: Set up Node.js ${{ inputs.nodeVersion }}
                uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
                with:
                    node-version: ${{ inputs.nodeVersion }}
            -   name: Set up mise (pnpm uit mise.toml)
                uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
                with:
                    install_args: "pnpm"
            -   name: Build, lint, typecheck, test and check formatting
                run: mise run frontend:check
