name: Promote

# ADR 0019, besluit 3 (#607): promotie is retaggen, niet herbouwen. Een handmatige dispatch kiest een groene build-once-build
# (standaard de nieuwste op main, of een oudere via commit of build-tag), zet x.y.z, x.y, x en latest op diezelfde digest per image,
# ondertekent en attesteert die en maakt de GitHub Release. Er is geen build en geen test in deze workflow: de poorten liepen al in
# build-once.yml, en alleen een geslaagde run daarvan levert digests op.
# x.y.z is onveranderlijk: een tweede promotie van dezelfde versie op een andere digest wordt geweigerd. x.y, x en latest schuiven
# alleen vooruit (scripts/promote-tags.mjs), dus een oudere patch zet `latest` nooit terug (besluit 7).
on:
    workflow_dispatch:
        inputs:
            build:
                description: "Te promoveren build: commit-sha (kort of volledig) of build-tag <versie>-<sha>. Leeg = nieuwste groene build op main."
                type: string
                default: ""
            version:
                description: "Release-versie x.y.z. Leeg = de versie uit de build-tag."
                type: string
                default: ""

# Promoties lopen na elkaar, zodat de keuze van x.y, x en latest steeds het resultaat van de vorige ziet.
concurrency:
    group: promote
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    resolve:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read # build-digests-artefact van de gekozen build-run downloaden
        outputs:
            run-id: ${{ steps.pick.outputs.run-id }}
            tag: ${{ steps.pick.outputs.tag }}
            commit: ${{ steps.pick.outputs.commit }}
            version: ${{ steps.pick.outputs.version }}
            backend: ${{ steps.pick.outputs.backend }}
            frontend: ${{ steps.pick.outputs.frontend }}
        steps:
            -   name: Guard branch
                run: |
                    if [ "${GITHUB_REF_NAME}" != "main" ]; then
                      echo "::error::promote.yml moet vanaf main gestart worden (kreeg ${GITHUB_REF_NAME})."
                      exit 1
                    fi
            -   name: Pick the green build
                id: pick
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    BUILD: ${{ inputs.build }}
                    VERSION_INPUT: ${{ inputs.version }}
                run: |
                    # Een build-tag <versie>-<sha> is hier een commit-prefix: neem het deel na het eerste streepje.
                    wanted="${BUILD#*-}"
                    wanted="${wanted,,}"
                    if [ -n "${wanted}" ] && ! [[ "${wanted}" =~ ^[0-9a-f]{7,40}$ ]]; then
                      echo "::error::Build \"${BUILD}\" is geen commit-sha of build-tag <versie>-<sha>."
                      exit 1
                    fi
                    # Alleen geslaagde push-runs op main: alle poorten waren groen en de images zijn gepusht.
                    runs=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow build-once.yml --branch main --event push \
                      --status success --limit 200 --json databaseId,headSha)
                    if [ -z "${wanted}" ]; then
                      row=$(jq -c '.[0] // empty' <<< "${runs}")
                    else
                      row=$(jq -c --arg w "${wanted}" '[.[] | select(.headSha | startswith($w))][0] // empty' <<< "${runs}")
                    fi
                    if [ -z "${row}" ]; then
                      echo "::error::Geen geslaagde build-once-run op main gevonden voor \"${BUILD:-nieuwste}\"."
                      exit 1
                    fi
                    run_id=$(jq -r '.databaseId' <<< "${row}")
                    gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" --name build-digests --dir digests
                    tag=$(jq -r '.tag' digests/build-digests.json)
                    version="${VERSION_INPUT:-${tag%%-*}}"
                    if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::Versie \"${version}\" is geen x.y.z."
                      exit 1
                    fi
                    {
                      echo "run-id=${run_id}"
                      echo "tag=${tag}"
                      echo "commit=$(jq -r '.commit' digests/build-digests.json)"
                      echo "version=${version}"
                      echo "backend=$(jq -r '.backend' digests/build-digests.json)"
                      echo "frontend=$(jq -r '.frontend' digests/build-digests.json)"
                    } >> "${GITHUB_OUTPUT}"
                    echo "::notice::Promotie van build ${tag} (run ${run_id}) als ${version}."

    promote:
        needs: resolve
        if: github.repository_owner == 'pinkroccade'
        runs-on: ubuntu-latest
        environment: release # goedkeuring voor productie (ADR 0019, besluit 3)
        permissions:
            contents: read
            actions: read # reports van de build-run downloaden
            packages: write # tags op bestaande digests zetten
            id-token: write # keyless cosign-handtekening
        env:
            VERSION: ${{ needs.resolve.outputs.version }}
            COMMIT: ${{ needs.resolve.outputs.commit }}
            BACKEND_REF: ${{ needs.resolve.outputs.backend }}
            FRONTEND_REF: ${{ needs.resolve.outputs.frontend }}
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
                    fetch-depth: 0
            -   name: Set up mise (node uit mise.toml)
                uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
                with:
                    install_args: "node"
            -   name: Install Cosign
                uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            -   name: Login to GitHub Container Registry
                uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Verify the build signature and SBOM attestation
                # De digest moet door build-once ondertekend en geattesteerd zijn voordat hij een releasetag krijgt.
                run: |
                    for ref in "${BACKEND_REF}" "${FRONTEND_REF}"; do
                      cosign verify "${ref}" \
                         --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/_build-app-image.yml@refs/heads/main" \
                         --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
                      cosign verify-attestation "${ref}" --type cyclonedx \
                         --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/_build-app-image.yml@refs/heads/main" \
                         --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
                    done

            -   name: Plan the tags
                run: |
                    mapfile -t existing < <(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
                    mise exec -- node scripts/promote-tags.mjs "${VERSION}" "${existing[@]}" > tags.txt
                    echo "::notice::Tags die schuiven: $(paste -sd' ' tags.txt)"

            -   name: Generate GitHub App token
                id: token
                uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
                with:
                    client-id: ${{ secrets.NL_PORTAL_APP_CLIENT_ID }}
                    private-key: ${{ secrets.NL_PORTAL_APP_PRIVATE_KEY }}
                    permission-contents: write # release en tag op de gebouwde commit
            -   name: Tag the build commit
                # Vóór de retag: het git-tag is de bron voor "latest schuift nooit terug" (planTags). Zo blijft die toestand ook
                # kloppen als de run na de retag afbreekt.
                env:
                    GH_TOKEN: ${{ steps.token.outputs.token }}
                run: |
                    existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" --jq '.object.sha' 2> /dev/null || true)
                    if [ -z "${existing}" ]; then
                      gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${VERSION}" -f "sha=${COMMIT}" > /dev/null
                    elif [ "${existing}" != "${COMMIT}" ]; then
                      echo "::error::Tag ${VERSION} staat al op ${existing}, niet op ${COMMIT}. x.y.z is onveranderlijk."
                      exit 1
                    fi
            -   name: Retag the existing digests
                run: |
                    retag() {
                      local repo="$1" ref="$2" digest="${2#*@}" current tag
                      # x.y.z is onveranderlijk: bestaat hij al, dan moet hij op deze digest staan.
                      current=$(docker buildx imagetools inspect "${repo}:${VERSION}" --format '{{.Manifest.Digest}}' 2> /dev/null || true)
                      if [ -n "${current}" ] && [ "${current}" != "${digest}" ]; then
                        echo "::error::${repo}:${VERSION} staat al op ${current}, niet op ${digest}. x.y.z is onveranderlijk."
                        exit 1
                      fi
                      while IFS= read -r tag; do
                        docker buildx imagetools create --tag "${repo}:${tag}" "${ref}"
                      done < tags.txt
                    }
                    retag ghcr.io/pinkroccade/nl-portal-backend "${BACKEND_REF}"
                    retag ghcr.io/pinkroccade/nl-portal-frontend "${FRONTEND_REF}"
            -   name: Verify every tag points at the build digest
                run: |
                    for ref in "${BACKEND_REF}" "${FRONTEND_REF}"; do
                      repo="${ref%@*}"
                      digest="${ref#*@}"
                      while IFS= read -r tag; do
                        actual=$(docker buildx imagetools inspect "${repo}:${tag}" --format '{{.Manifest.Digest}}')
                        if [ "${actual}" != "${digest}" ]; then
                          echo "::error::${repo}:${tag} wijst naar ${actual}, niet naar ${digest}."
                          exit 1
                        fi
                      done < tags.txt
                    done

            -   name: Sign the promoted digests
                run: |
                    for ref in "${BACKEND_REF}" "${FRONTEND_REF}"; do
                      cosign sign --yes "${ref}"
                    done
            -   name: Verify the promotion signature
                run: |
                    for ref in "${BACKEND_REF}" "${FRONTEND_REF}"; do
                      cosign verify "${ref}" \
                         --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/promote.yml@refs/heads/main" \
                         --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
                    done

            -   name: Generate the backend image SBOM
                uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
                with:
                    image: ${{ needs.resolve.outputs.backend }}
                    format: cyclonedx-json
                    output-file: nl-portal-backend-${{ needs.resolve.outputs.version }}.image.sbom.cyclonedx.json
                    upload-artifact: false
                    upload-release-assets: false
            -   name: Generate the frontend image SBOM
                uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
                with:
                    image: ${{ needs.resolve.outputs.frontend }}
                    format: cyclonedx-json
                    output-file: nl-portal-frontend-${{ needs.resolve.outputs.version }}.image.sbom.cyclonedx.json
                    upload-artifact: false
                    upload-release-assets: false
            -   name: Attest the SBOMs on the promoted digests
                run: |
                    cosign attest --yes --type cyclonedx --predicate "nl-portal-backend-${VERSION}.image.sbom.cyclonedx.json" "${BACKEND_REF}"
                    cosign attest --yes --type cyclonedx --predicate "nl-portal-frontend-${VERSION}.image.sbom.cyclonedx.json" "${FRONTEND_REF}"

            -   name: Create the GitHub release
                env:
                    GH_TOKEN: ${{ steps.token.outputs.token }}
                run: |
                    # De GitHub Release met de vlag Latest volgt `latest`: een oudere patch markeert zichzelf niet als nieuwste.
                    if grep -qx latest tags.txt; then latest=--latest; else latest=--latest=false; fi
                    if gh release view "${VERSION}" > /dev/null 2>&1; then
                      echo "::notice::Release ${VERSION} bestaat al - overgeslagen."
                    else
                      # De changelog-sectie hoort bij de release; ontbreekt hij nog (de changelog-bot is #608), dan genereert GitHub de notes.
                      if mise exec -- node scripts/changelog-section.mjs "${VERSION}" > release-notes.md 2> /dev/null; then
                        gh release create "${VERSION}" --verify-tag "${latest}" --title "${VERSION}" --notes-file release-notes.md
                      else
                        gh release create "${VERSION}" --verify-tag "${latest}" --title "${VERSION}" --generate-notes
                      fi
                    fi
            -   name: Attach the image SBOMs to the GitHub release
                env:
                    GH_TOKEN: ${{ steps.token.outputs.token }}
                run: gh release upload "${VERSION}" nl-portal-*-"${VERSION}".image.sbom.cyclonedx.json --clobber
            -   name: Download the backend reports of the build
                continue-on-error: true # artefacten verlopen; de release is zonder deze bijlagen nog geldig
                uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
                with:
                    name: backend-reports
                    path: reports
                    run-id: ${{ needs.resolve.outputs.run-id }}
                    github-token: ${{ secrets.GITHUB_TOKEN }}
            -   name: Attach the backend SBOM and reports to the GitHub release
                if: hashFiles('reports/backend-reports.tar') != ''
                env:
                    GH_TOKEN: ${{ steps.token.outputs.token }}
                working-directory: reports
                run: |
                    tar -xf backend-reports.tar
                    mv sbom.cyclonedx.json "nl-portal-backend-${VERSION}.sbom.cyclonedx.json"
                    assets=("nl-portal-backend-${VERSION}.sbom.cyclonedx.json")
                    if [ -f build/reports/dependency-license/index.html ]; then
                      mv build/reports/dependency-license/index.html "nl-portal-backend-${VERSION}.licenses.html"
                      assets+=("nl-portal-backend-${VERSION}.licenses.html")
                    fi
                    gh release upload "${VERSION}" "${assets[@]}" --clobber

            -   name: Write summary
                env:
                    BUILD_TAG: ${{ needs.resolve.outputs.tag }}
                run: |
                    {
                      echo "## Gepromoveerd: ${VERSION}"
                      echo ""
                      echo "Commit \`${COMMIT}\`, build \`${BUILD_TAG}\`. Geen herbouw; dezelfde digests als de build."
                      echo ""
                      echo "Tags: $(paste -sd' ' tags.txt)"
                      echo ""
                      echo "- backend \`${BACKEND_REF}\`"
                      echo "- frontend \`${FRONTEND_REF}\`"
                    } >> "${GITHUB_STEP_SUMMARY}"
