name: Publish Helm Chart

# Publiceert helm/nl-portal als gesigneerd OCI-artifact op ghcr (oci://ghcr.io/pinkroccade/charts/nl-portal),
# maakt de tag `chart-nl-portal-X.Y.Z` en een GitHub Release met de changelog en het `cosign verify`-commando.
#
# Twee triggers, één pad:
#   - push naar main of release/*.x die Chart.yaml wijzigt: een versiebump van de chart levert zonder handmatige tag
#     een release op (chartfix zonder app-release).
#   - push van een tag `chart-nl-portal-*`: de app-release (build-and-publish-release.yml) tagt de chart nadat de
#     images bestaan; die tag moet gelijk zijn aan `version` in Chart.yaml.
# Idempotent: bestaat de chartversie al in het register, dan gebeurt er niets. De app-tags (X.Y.Z) blijven los.
# Afweging van de triggers: site/hosting-en-configuratie/kubernetes/uitleg-ontwerpkeuzes.md.

on:
    push:
        branches:
            - main
            - "release/*.x"
        paths:
            - helm/nl-portal/Chart.yaml
        tags:
            - "chart-nl-portal-*"

# Eén publicatie tegelijk: een tag-run en een push-run voor dezelfde versie wachten op elkaar, zodat de tweede
# het artifact al in het register vindt en niets doet.
concurrency:
    group: helm-chart-publish
    cancel-in-progress: false

permissions: {}

env:
    CHART_DIR: helm/nl-portal
    CHART_REPOSITORY: ghcr.io/pinkroccade/charts

jobs:
    publish:
        if: github.repository_owner == 'pinkroccade'
        runs-on: ubuntu-latest
        permissions:
            contents: write # GitHub Release en chart-tag aanmaken
            packages: write # chart naar ghcr pushen
            id-token: write # keyless cosign-handtekening via GitHub OIDC
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   name: Set up mise (helm, kubeconform, helm-unittest)
                uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
                with:
                    install_args: "helm kubeconform github:helm-unittest/helm-unittest"
                    cache: false # een release-workflow gebruikt geen cache die een andere run kan vergiftigen
            -   name: Log in op ghcr
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    ACTOR: ${{ github.actor }}
                run: |
                    echo "${GITHUB_TOKEN}" | mise exec -- helm registry login ghcr.io --username "${ACTOR}" --password-stdin
            -   name: Bepaal of er gepubliceerd moet worden
                id: decide
                env:
                    GH_TOKEN: ${{ github.token }}
                    REPO: ${{ github.repository }}
                    REF_TYPE: ${{ github.ref_type }}
                    REF_NAME: ${{ github.ref_name }}
                run: |
                    chart_version=$(sed -n 's/^version: *//p' "${CHART_DIR}/Chart.yaml" | tr -d '"')
                    app_version=$(sed -n 's/^appVersion: *//p' "${CHART_DIR}/Chart.yaml" | tr -d '"')
                    tag="chart-nl-portal-${chart_version}"

                    if out=$(mise exec -- helm show chart "oci://${CHART_REPOSITORY}/nl-portal" --version "${chart_version}" 2>&1); then
                      oci_exists=true
                    elif grep -qiE 'not found|404|manifest unknown' <<< "${out}"; then
                      oci_exists=false
                    else
                      echo "::error::Kan het register niet bevragen: ${out}"
                      exit 1
                    fi

                    if gh api "repos/${REPO}/git/ref/tags/${tag}" > /dev/null 2>&1; then tag_exists=true; else tag_exists=false; fi

                    images_exist=true
                    for stack in backend frontend; do
                      docker buildx imagetools inspect "ghcr.io/pinkroccade/nl-portal-${stack}:${app_version}" > /dev/null 2>&1 || images_exist=false
                    done

                    if [ "${REF_TYPE}" = "tag" ]; then
                      export EVENT=tag TAG_VERSION="${REF_NAME#chart-nl-portal-}"
                    else
                      export EVENT=push
                    fi
                    OCI_EXISTS="${oci_exists}" TAG_EXISTS="${tag_exists}" IMAGES_EXIST="${images_exist}" \
                      mise exec -- node scripts/chart-release.mjs decide >> "$GITHUB_OUTPUT"
            -   name: Valideer de chart
                if: steps.decide.outputs.publish == 'true'
                run: |
                    mise run helm:lint
                    mise run helm:test
            -   name: Install Cosign
                if: steps.decide.outputs.publish == 'true'
                uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
            -   name: Package en push
                id: push
                if: steps.decide.outputs.publish == 'true'
                env:
                    VERSION: ${{ steps.decide.outputs.version }}
                run: |
                    mise exec -- helm package "${CHART_DIR}" --destination dist
                    mise exec -- helm push "dist/nl-portal-${VERSION}.tgz" "oci://${CHART_REPOSITORY}" 2>&1 | tee push.log
                    digest=$(sed -n 's/^Digest: *//p' push.log)
                    [ -n "${digest}" ] || { echo "::error::Geen digest in de uitvoer van helm push."; exit 1; }
                    echo "digest=${digest}" >> "$GITHUB_OUTPUT"
            -   name: Onderteken de chart met het GitHub OIDC-token
                if: steps.decide.outputs.publish == 'true'
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    ACTOR: ${{ github.actor }}
                    DIGEST: ${{ steps.push.outputs.digest }}
                run: |
                    # cosign leest de inloggegevens van helm niet; zonder eigen login faalt de upload van de handtekening.
                    echo "${GITHUB_TOKEN}" | cosign login ghcr.io --username "${ACTOR}" --password-stdin
                    cosign sign --yes "${CHART_REPOSITORY}/nl-portal@${DIGEST}"
            -   name: Controleer de handtekening
                if: steps.decide.outputs.publish == 'true'
                env:
                    DIGEST: ${{ steps.push.outputs.digest }}
                run: |
                    cosign verify "${CHART_REPOSITORY}/nl-portal@${DIGEST}" \
                       --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-helm-chart.yml@${GITHUB_REF}" \
                       --certificate-oidc-issuer https://token.actions.githubusercontent.com
            -   name: Maak de GitHub Release (bij een push ook de chart-tag)
                if: steps.decide.outputs.publish == 'true'
                env:
                    GH_TOKEN: ${{ github.token }}
                    VERSION: ${{ steps.decide.outputs.version }}
                    APP_VERSION: ${{ steps.decide.outputs.appVersion }}
                    DIGEST: ${{ steps.push.outputs.digest }}
                    REPOSITORY: ${{ github.repository }}
                    REF: ${{ github.ref }}
                    SHA: ${{ github.sha }}
                run: |
                    tag="chart-nl-portal-${VERSION}"
                    mise exec -- node scripts/chart-release.mjs notes > release-notes.md
                    if gh release view "${tag}" > /dev/null 2>&1; then
                      echo "::notice::Release ${tag} bestaat al; notes ongemoeid gelaten."
                    else
                      # --target maakt de tag op deze commit aan als hij nog niet bestaat (push-pad); een bestaande tag blijft staan.
                      gh release create "${tag}" --target "${SHA}" --title "nl-portal chart ${VERSION}" --notes-file release-notes.md
                    fi
