name: Secret scan

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read
    issues: write

concurrency:
    group: secret-scan-${{ github.ref }}
    cancel-in-progress: true

env:
    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
    secret-scan:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   name: Set up mise
                uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
                with:
                    install_args: "gitleaks"
            -   name: Set up Node.js
                uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
                with:
                    node-version: "24"
            -   name: Scan the working tree for secrets
                run: mise run security:secrets-scan
            -   name: Scan the git history for secrets
                # Vindt ook secrets die ooit zijn gecommit en later verwijderd; nieuwe bevindingen laten de run falen.
                run: mise run security:secrets-scan-history
            -   name: Genereer JSON-rapport voor escalatie
                if: always()
                run: gitleaks detect --source . --no-banner --no-git --config .gitleaks.toml --redact --report-format json --report-path gitleaks-report.json --exit-code 0
            -   name: Escaleer gevonden secrets
                if: always()
                run: node scripts/escalate-findings.mjs --source=secret-scan --report=gitleaks-report.json
