# Prototype T1 (#500): echte Keycloak 26.8 met twee realms: `portal` (de gemeente-realm met `nl-portal-backend`)
# en `idp-sim` (simuleert DigiD via SAML en de wallet via OIDC). Poort gelijk binnen en buiten de container,
# zodat de broker zichzelf bereikt zonder hostname-trucs.
name: nlp-t1-claims
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "18080"
      KC_HOSTNAME: http://localhost:18080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "18080:18080"
    volumes:
      - ./realms:/opt/keycloak/data/import:ro
      - ./keycloak-spi/build/providers:/opt/keycloak/providers:ro
